name: Phase 4.5.1 CI

on:
  push:
    branches: ["initial-setup"]
  pull_request:
    branches: ["initial-setup"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-4-5-1-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: ${{ matrix.os }} / Node ${{ matrix.node }} / Phase 4.5.1
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 18
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: windows-latest
            node: 18
          - os: windows-latest
            node: 20
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 18
          - os: macos-latest
            node: 20
          - os: macos-latest
            node: 22
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install from lockfile
        run: npm ci --ignore-scripts

      - name: Lockfile contract
        run: npm test -- --runInBand tests/lockfile-contract.test.js

      - name: Lint
        run: npm run lint

      - name: Test suite
        run: npm test -- --runInBand

      - name: Smoke test
        run: npm run smoke

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
