name: Lockfile Reconciliation

on:
  push:
    branches: ["phase-4.5.1-reconciliation-automation"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yasin-cli-lockfile-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile and validate npm lockfile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile from package manifest
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit reconciled lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already matches package.json."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: reconcile npm lockfile"
          git push origin HEAD:phase-4.5.1-reconciliation-automation

      - name: Validate clean install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Smoke test
        run: npm run smoke
